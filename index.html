<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#7b4b94">
<title>Closet Assistant</title>
<style>
:root{--bg:#faf7fb;--card:#fff;--ink:#241b2b;--mut:#7a6d84;--acc:#7b4b94;--line:#e8e0ed;--r:16px;color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#171219;--card:#241d28;--ink:#f3edf6;--mut:#a99bb3;--acc:#c79be0;--line:#3a3042;color-scheme:dark}}
:root[data-theme=dark]{--bg:#171219;--card:#241d28;--ink:#f3edf6;--mut:#a99bb3;--acc:#c79be0;--line:#3a3042;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);padding-bottom:calc(76px + env(safe-area-inset-bottom))}
header{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;position:sticky;top:0;background:var(--bg);z-index:5}
h1{font-size:20px;margin:0}
h2{font-size:18px;margin:0 0 12px}
button{font:inherit;color:inherit;cursor:pointer}
.menu-btn{border:0;background:none;font-size:26px;line-height:1;width:44px;height:44px;border-radius:12px;color:var(--ink)}
.sp{width:44px}
.btn{background:var(--acc);color:#fff;border:0;border-radius:999px;padding:12px 20px;font-weight:600;display:inline-block;text-align:center}
.btn[disabled]{opacity:.4}
.btn.sec{background:transparent;color:var(--acc);border:1.5px solid var(--acc)}
.btn.danger{background:transparent;color:#d33;border:1.5px solid #d33}
.chips{display:flex;flex-wrap:wrap;gap:8px;padding:0 16px 12px}
.sheet .chips{padding:0 0 12px}
.chip{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:8px 14px}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(105px,1fr));gap:10px;padding:0 16px}
.tile{position:relative;aspect-ratio:3/4;border-radius:var(--r);overflow:hidden;background:var(--card);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:38px;width:100%}
.tile img{width:100%;height:100%;object-fit:cover;display:block}
.dot{position:absolute;left:6px;bottom:6px;width:20px;height:20px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.3)}
button.tile{padding:0}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:6}
nav button{flex:1;border:0;background:none;padding:14px 0;color:var(--mut)}
nav button.on{color:var(--acc);font-weight:700}
.fab{position:fixed;right:18px;bottom:calc(80px + env(safe-area-inset-bottom));width:58px;height:58px;border-radius:50%;border:0;background:var(--acc);color:#fff;font-size:32px;line-height:1;box-shadow:0 4px 14px rgba(0,0,0,.3);z-index:6}
.empty,.note{color:var(--mut);padding:24px 16px;text-align:center}
.note{font-size:13px;padding:16px}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;z-index:20}
.sheet{background:var(--card);width:100%;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
.prev{width:100%;max-height:260px;object-fit:contain;border-radius:12px;background:var(--bg);margin-bottom:12px}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}
.row>*{flex:1}
.palette{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:6px}
.palette.wide{grid-template-columns:repeat(6,1fr);gap:8px}
.sw{aspect-ratio:1;border-radius:50%;border:3px solid transparent;box-shadow:0 0 0 1px var(--line);padding:0}
.sw.on{border-color:var(--acc);box-shadow:0 0 0 2px var(--card),0 0 0 4px var(--acc)}
.lbl{font-size:14px;color:var(--mut);margin:10px 0 8px}
.det{display:flex;align-items:center;gap:12px;font-size:18px;margin:8px 0 4px}
.det i{width:36px;height:36px;border-radius:50%;display:inline-block;box-shadow:0 0 0 1px var(--line)}
.pad{padding:0 16px 12px}
.opt{display:flex;gap:10px;align-items:center;padding:0 16px 14px}
.opt input{width:20px;height:20px}
.inp{font:inherit;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;min-width:0}
.small{color:var(--mut);font-size:13px}
.outfit{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px;margin:0 16px 14px}
.outfit small{color:var(--mut);display:block;margin-bottom:8px}
.pieces{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.piece{width:86px;flex:none;text-align:center;font-size:12px}
.piece .tile{font-size:28px;margin-bottom:4px}
.piece span{color:var(--mut);display:block}
.drawer-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:30;opacity:0;pointer-events:none;transition:opacity .2s}
.drawer{position:fixed;top:0;bottom:0;left:0;width:min(82vw,320px);background:var(--card);z-index:31;transform:translateX(-100%);transition:transform .2s;padding:calc(18px + env(safe-area-inset-top)) 0 16px;overflow:auto;box-shadow:2px 0 14px rgba(0,0,0,.25)}
.dw.open .drawer-bg{opacity:1;pointer-events:auto}
.dw.open .drawer{transform:none}
.dh{font-size:20px;font-weight:700;padding:0 18px 12px}
.mi{display:flex;width:100%;gap:12px;align-items:center;padding:14px 18px;border:0;background:none;text-align:left;font-size:16px;cursor:pointer}
.mh{padding:14px 18px 4px;color:var(--mut);font-size:13px}
</style>
</head>

/* ---------- storage ----------
   Data lives in IndexedDB (name 'closet', store 'items') on this site's address.
   Updating this file never touches it. If the schema ever changes, bump the version
   and migrate inside onupgradeneeded instead of recreating the store. */
let db=null,mem=[];
function openDB(){return new Promise(res=>{try{const r=indexedDB.open('closet',1);r.onupgradeneeded=()=>r.result.createObjectStore('items',{keyPath:'id'});r.onsuccess=()=>{db=r.result;res()};r.onerror=()=>res()}catch(e){res()}})}
const store=m=>db.transaction('items',m).objectStore('items');
const reqP=r=>new Promise((ok,no)=>{r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)});
async function dbAll(){return db?reqP(store('readonly').getAll()):mem}
async function dbPut(o){if(db)await reqP(store('readwrite').put(o));else{mem=mem.filter(x=>x.id!==o.id);mem.push(o)}}
async function dbDel(id){if(db)await reqP(store('readwrite').delete(id));else mem=mem.filter(x=>x.id!==id)}
async function reload(){S.items=(await dbAll()).sort((a,b)=>b.t-a.t);if(S.must&&!S.items.some(i=>i.id===S.must))S.must=null}

async function loadWx(){

/* ---------- colour detection ---------- */
const hex2rgb=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));
function lab(r,g,b){[r,g,b]=[r,g,b].map(v=>{v/=255;return v>.04045?Math.pow((v+.055)/1.055,2.4):v/12.92});
 const x=(r*.4124+g*.3576+b*.1805)/.95047,y=r*.2126+g*.7152+b*.0722,z=(r*.0193+g*.1192+b*.9505)/1.08883;
 const f=t=>t>.008856?Math.cbrt(t):7.787*t+16/116;
 return [116*f(y)-16,500*(f(x)-f(y)),200*(f(y)-f(z))]}
const PLAB=Object.fromEntries(BASE.map(k=>[k,lab(...hex2rgb(P[k][0]))])); // automatic detection only ever returns a basic colour
function nearest(rgb){const l=lab(...rgb);let best=null,bd=1e9;
 for(const k in PLAB){const p=PLAB[k],d=(l[0]-p[0])**2+(l[1]-p[1])**2+(l[2]-p[2])**2;if(d<bd){bd=d;best=k}}return best}
const dist=(a,b)=>Math.hypot(a[0]-b[0],a[1]-b[1],a[2]-b[2]);
function detectFull(c){
 const N=64,t=document.createElement('canvas');t.width=t.height=N;
 const x=t.getContext('2d',{willReadFrequently:true});x.drawImage(c,0,0,N,N);
 const d=x.getImageData(0,0,N,N).data;
 const px=(i,j)=>{const o=(j*N+i)*4;return [d[o],d[o+1],d[o+2]]};
 const bd=[];for(let i=0;i<N;i++)for(const j of [0,1,N-2,N-1]){bd.push(px(i,j),px(j,i))}
 const m=[0,1,2].map(k=>bd.reduce((s,p)=>s+p[k],0)/bd.length);
 const uniform=bd.reduce((s,p)=>s+dist(p,m),0)/bd.length<28;
 const all=[],kept=[];
 for(let i=6;i<N-6;i++)for(let j=6;j<N-6;j++){const p=px(i,j);all.push(p);if(!(uniform&&dist(p,m)<45))kept.push(p)}
 const use=kept.length>=all.length*.08?kept:all;
 const B={};
 for(const p of use){const k=(p[0]>>5)<<6|(p[1]>>5)<<3|(p[2]>>5);const b=B[k]||(B[k]={n:0,s:[0,0,0]});b.n++;b.s[0]+=p[0];b.s[1]+=p[1];b.s[2]+=p[2]}
 let top=null;for(const k in B)if(!top||B[k].n>top.n)top=B[k];
 const rgb=top.s.map(v=>v/top.n);return {id:nearest(rgb),lab:lab(...rgb)};
}
const detect=c=>detectFull(c).id;
function loadImg(file){return new Promise((ok,no)=>{const u=URL.createObjectURL(file),i=new Image();i.onload=()=>{URL.revokeObjectURL(u);ok(i)};i.onerror=no;i.src=u})}
function shrink(img,max=480){const k=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));
 const c=document.createElement('canvas');c.width=Math.round(img.naturalWidth*k);c.height=Math.round(img.naturalHeight*k);
 c.getContext('2d').drawImage(img,0,0,c.width,c.height);return c}

/* ---------- on-device item recognition (optional, opt-in) ----------
   Zero-shot image classification with CLIP through Transformers.js, running in the browser.
   Nothing is uploaded. The quantized model files (~155 MB) are downloaded once and cached by the library. */
const ML_LIB='https://cdn.jsdelivr.net/npm/@xenova/transformers@2.5.4';
const ML_MODEL='Xenova/clip-vit-base-patch32';
let ML_IMPORT=u=>import(u);
const ML={p:null,ready:false,files:{},pct:0};
const LABELS={
 top:['a t-shirt','a blouse','a shirt','a sweater','a hoodie','a tank top'],
 bottom:['jeans','trousers','a skirt','shorts','leggings'],
 dress:['a dress'],jumpsuit:['a jumpsuit'],
 outer:['a jacket','a coat','a blazer','a cardigan'],
 shoes:['sneakers','boots','sandals','high heels','flat shoes'],
 bag:['a handbag','a backpack'],belt:['a belt'],hat:['a hat','a cap','a beanie'],sunglasses:['sunglasses'],
 scarf:['a silk scarf'],winterscarf:['a knitted winter scarf'],gloves:['gloves'],watch:['a wristwatch'],
 necklace:['a necklace'],earrings:['earrings'],bracelet:['a bracelet'],ring:['a jewelry ring'],tights:['tights']};
function mlProgress(e){
 if(!e||!e.file)return;
 const f=ML.files[e.file]||(ML.files[e.file]={p:0,loaded:0,total:0});
 if(e.status==='progress'){
  if(Number.isFinite(e.progress))f.p=e.progress;
  if(Number.isFinite(e.loaded))f.loaded=e.loaded;
  if(Number.isFinite(e.total))f.total=e.total}
 else if(e.status==='done'){f.p=100;if(f.total)f.loaded=f.total}
 const fs=Object.values(ML.files),tot=fs.reduce((a,x)=>a+x.total,0);
 const pct=tot>0&&fs.every(x=>x.total>0)?fs.reduce((a,x)=>a+x.loaded,0)/tot*100:fs.reduce((a,x)=>a+x.p,0)/fs.length;
 const r=Math.max(0,Math.min(100,Math.round(pct)));
 if(r!==ML.pct){ML.pct=r;if(draft&&(draft.phase==='confirmcat'||draft.phase==='photo'))sheet()}}
const l2=a=>{const n=Math.hypot(...a)||1;return Array.from(a,x=>x/n)};
const dotp=(a,b)=>{let s=0;for(let i=0;i<a.length;i++)s+=a[i]*b[i];return s};
// Same CLIP model as before, but loaded as an image part and a text part so the image embedding can also be reused for learning.
function mlLoad(){
 if(ML.p)return ML.p;
 ML.files={};ML.pct=0;ML.ready=false;
 ML.p=(async()=>{
  const lib=await ML_IMPORT(ML_LIB),o=()=>({quantized:true,progress_callback:mlProgress}); // separate option objects: the library writes the model file name into them
  const [proc,vm,tok,tm]=await Promise.all([lib.AutoProcessor.from_pretrained(ML_MODEL,{progress_callback:mlProgress}),
   lib.CLIPVisionModelWithProjection.from_pretrained(ML_MODEL,o()),
   lib.AutoTokenizer.from_pretrained(ML_MODEL,{progress_callback:mlProgress}),
   lib.CLIPTextModelWithProjection.from_pretrained(ML_MODEL,o())]);
  const cand=[],owner=[];
  for(const c in LABELS)for(const l of LABELS[c]){cand.push('a photo of '+l);owner.push(c)}
  const t=await tm(tok(cand,{padding:true,truncation:true})),D=t.text_embeds.dims[1];
  const txt=cand.map((_,i)=>l2(t.text_embeds.data.slice(i*D,(i+1)*D)));
  const sp=[],so=[];for(const k in SUBLABELS)for(const l of SUBLABELS[k]){sp.push('a photo of '+l);so.push(k)}
  const t2=await tm(tok(sp,{padding:true,truncation:true})),txtSub=sp.map((_,i)=>l2(t2.text_embeds.data.slice(i*D,(i+1)*D)));
  ML.ready=true;return {lib,proc,vm,txt,owner,txtSub,subOwner:so}})().catch(e=>{ML.p=null;ML.ready=false;throw e});
 return ML.p}

/* ---------- learning (on-device memory of the user's confirmations) ----------
   Stored in localStorage key 'learn': no photos, only small numbers.
   cat: [{e:[512 ints = image embedding*127], c:category}]  col: [{l:[L,a,b], c:colour}]  st: guess statistics */
const LEARN_MAX={cat:300,col:200};
const SIM_MIN=0.85; // an example only counts when it looks this similar (tuned on the 20 test photos, see notes)
function cleanLearn(o){
 const L={cat:[],col:[],st:{n:0,ok:0}};
 if(!o||typeof o!=='object')return L;
 for(const x of Array.isArray(o.cat)?o.cat:[])
  if(x&&Array.isArray(x.e)&&x.e.length===512&&x.e.every(v=>Number.isInteger(v)&&v>=-127&&v<=127)&&own(I18N.el.cats,x.c))L.cat.push(x.c==='shoes'&&SUBS.includes(x.s)?{e:x.e,c:x.c,s:x.s}:{e:x.e,c:x.c});
 for(const x of Array.isArray(o.col)?o.col:[])
  if(x&&Array.isArray(x.l)&&x.l.length===3&&x.l.every(Number.isFinite)&&own(P,x.c))L.col.push({l:x.l.map(v=>Math.round(v*10)/10),c:x.c});
 if(o.st&&Number.isInteger(o.st.n)&&Number.isInteger(o.st.ok)&&o.st.n>=0&&o.st.ok>=0&&o.st.ok<=o.st.n)L.st={n:o.st.n,ok:o.st.ok};
 L.cat=L.cat.slice(-LEARN_MAX.cat);L.col=L.col.slice(-LEARN_MAX.col);return L}
function loadLearn(){try{return cleanLearn(JSON.parse(ls.get('learn')))}catch(e){return cleanLearn(null)}}
let LEARN=loadLearn();
const saveLearn=()=>ls.set('learn',JSON.stringify(LEARN));
const q8=v=>v.map(x=>Math.max(-127,Math.min(127,Math.round(x*127))));
const dq8=e=>l2(e.map(x=>x/127));
function learnCat(emb,cat,sub){
 const e=q8(emb),v=dq8(e);
 // a near-identical photo already remembered: replace it instead of piling up copies
 LEARN.cat=LEARN.cat.filter(x=>!(dotp(dq8(x.e),v)>0.98&&x.c===cat));
 LEARN.cat.push(cat==='shoes'&&SUBS.includes(sub)?{e,c:cat,s:sub}:{e,c:cat});if(LEARN.cat.length>LEARN_MAX.cat)LEARN.cat.shift();saveLearn()}
function learnColor(lab,col){
 const l=lab.map(v=>Math.round(v*10)/10);
 LEARN.col=LEARN.col.filter(x=>!(dist(x.l,l)<2&&x.c===col));
 LEARN.col.push({l,c:col});if(LEARN.col.length>LEARN_MAX.col)LEARN.col.shift();saveLearn()}
// Colour suggestion: the palette's nearest colour has a fixed weight, remembered corrections nearby add weight for their colour.
function suggestColor(lab,auto){
 const w={};w[auto]=0.6;let used=false;
 for(const x of LEARN.col){const d=dist(x.l,lab);if(d<=10){w[x.c]=(w[x.c]||0)+1/(1+d/5);if(x.c!==auto)used=true}}
 const best=Object.keys(w).sort((a,b)=>w[b]-w[a])[0];
 return {id:best,learned:best!==auto&&used}}
// Returns {ranked:[{cat,score}] (up to 3, or null if not confident), emb}.
async function guessCat(dataUrl){
 const m=await mlLoad();

 const raw=await (await fetch(dataUrl)).blob(),url=URL.createObjectURL(raw);

  const c=document.createElement('canvas');c.width=im.naturalWidth;c.height=im.naturalHeight;c.getContext('2d').drawImage(im,0,0);h=dHash(c)}catch(_){}

const hueDiff=(a,b)=>{const d=Math.abs(a-b)%360;return d>180?360-d:d};
function chromaIds(list){return [...new Set(list.map(i=>fam(i.color)).filter(c=>!P[c][2]))]}
function cs(list){
 const ids=chromaIds(list),all=new Set(list.map(i=>fam(i.color)));let s=0;
 if(ids.length>2)s-=3*(ids.length-2);
 for(let a=0;a<ids.length;a++)for(let b=a+1;b<ids.length;b++){
  const d=hueDiff(P[ids[a]][1],P[ids[b]][1]);
  if(d<=30||d>=150)s+=1.5;else if(d>=100&&d<=140)s+=.3;else s-=2.5}
 if(all.has('black')&&all.has('navy'))s-=1.5;

/* One patterned piece among plain ones looks deliberate; two or more fight each other.
   A patterned accessory is far less loud than a patterned garment, so it costs less. */
function patScore(list){
 const b=list.filter(busy),n=b.length;

const fit=list=>cs(list)+patScore(list);
function reasonOf(list){

 if(ids.length===0)return 'allNeutral';
 if(ids.length===1)return 'oneColor';
 if(ids.length===2){const d=hueDiff(P[ids[0]][1],P[ids[1]][1]);if(d<=30)return 'analog';if(d>=150)return 'compl'}

// How well a pair of shoes suits the occasion and the weather (shoes without a sub-type stay neutral).
const SHOE_OCC={casual:{sneakers:.6,athletic:.2,flats:.4,loafers:.4,ankle:.3,boots:.2,platform:.2,sandals:.3,heels:-.3},
 smart:{heels:.6,loafers:.6,flats:.5,ankle:.5,boots:.3,platform:.3,sneakers:-.1,athletic:-.8,sandals:-.2},
 formal:{heels:1,flats:.5,loafers:.4,ankle:.4,boots:.1,platform:.3,sneakers:-.8,athletic:-1.5,sandals:-.5},
 sport:{athletic:1.2,sneakers:.8,boots:-.8,ankle:-.8,heels:-1.5,platform:-1,flats:-.8,sandals:-.8,loafers:-1}};
function shoeFit(i,o){
 if(!i||!i.sub)return 0;
 let v=((SHOE_OCC[o.occ]||{})[i.sub])||0;
 const w=o.w;if(w){
  if(w.rain>=60)v+=({boots:.6,ankle:.6,sneakers:.2,athletic:.2,sandals:-1,flats:-.3,heels:-.3,platform:-.3})[i.sub]||0;
  if(w.tmax<12)v+=({boots:.8,ankle:.6,sandals:-1.2,flats:-.3})[i.sub]||0;
  if(w.tmax>=26)v+=({sandals:.8,flats:.3,boots:-1,ankle:-.8})[i.sub]||0}

function moodScore(b,list,mood){

function addAcc(main,items,o,must){
 let cur=[...main];const picked=[];let extra=0;

 if(mc){cur.push(must);picked.push(must);if(mc!=='bag')extra++}
 const cap=o.mood==='comfy'?1:3;
 const hasDress=main.some(i=>i.cat==='dress');
 const cats=ACC.filter(c=>o.cold||!COLD.includes(c)).filter(c=>c!=='tights'||(hasDress&&o.tightsOk))
  .filter(c=>c!=='sunglasses'||!o.noSun).filter(c=>c!==mc)
  .sort(()=>Math.random()-.5)
  .sort((a,b)=>o.mood==='elegant'?(DRESSY.includes(b)-DRESSY.includes(a)):0)
  .sort((a,b)=>(b==='bag')-(a==='bag'));

  const cand=items.filter(i=>i.cat===c);if(!cand.length)continue;
  if(c!=='bag'&&extra>=cap)continue;

  for(const i of cand){const s=fit([...cur,i])+Math.random()*.4;if(s>bs){bs=s;best=i}}

function suggest(items,o,must){

 else if(mc==='bottom'){bots=[must];dr=[]}

 const d=draft;
 let h=`<h2>${d.id?T.edit:T.addTitle}</h2>`;
 if(qTotal>1&&!d.id&&d.phase!=='photo')h+=`<div class="small" style="margin:-6px 0 8px">${T.photoN(qIndex,qTotal)}</div>`;
 if(d.img)h+=`<img class="prev" src="${d.img}" alt="">`;
 const skip=qTotal>1&&!d.id?`<button class="btn sec" data-act="skip">${T.skipB}</button>`:'';
 const back=d.hist&&d.hist.length&&!d.id?`<button class="btn sec" data-act="back">${T.back}</button>`:'';
 if(d.phase==='photo'){
  if(d.busy)h+=`<div class="lbl">${T.processing}</div>`;
  else{
   h+=`<div class="row"><label class="btn">${T.takePhoto}<input type="file" accept="image/*" capture="environment" data-in hidden></label>
  <label class="btn sec">${T.gallery}<input type="file" accept="image/*" multiple data-in hidden></label></div>
  <div class="row"><button class="btn sec" data-act="nophoto">${T.noPhoto}</button><button class="btn sec" data-act="close">${T.cancel}</button></div>
  <div class="chips" style="padding:14px 0 6px">${chip(S.ml,'toggleml','',(S.ml?'✓ ':'')+T.mlName)}</div>`;
   if(S.ml&&ML.p&&!ML.ready)h+=`<div class="small">${T.mlDownloading(ML.pct)}</div>`;
   else if(!S.ml)h+=`<div class="small">${T.mlNote}</div>`}
 }else if(d.phase==='confirm'){
  h+=`<div class="lbl">${T.detected}</div><div class="det"><i style="background:${P[d.det][0]}"></i><b>${cname(d.det)}</b></div>${d.lc?`<div class="small">${T.learnedColor}</div>`:''}<div class="lbl">${T.correct}</div>
  <div class="row"><button class="btn" data-act="yes">${T.yes}</button><button class="btn sec" data-act="no">${T.no}</button></div>`;
  if(skip)h+=`<div class="row">${skip}</div>`;
 }else if(d.phase==='confirmsub'&&d.subGuess){
  const g=d.subGuess;
  h+=`<div class="lbl">${T.mlGuess}</div><div class="det"><span style="font-size:32px">${EMOJI.shoes}</span><b>${T.subs[g[0].id]}</b></div><div class="lbl">${T.correct}</div>
  <div class="row"><button class="btn" data-act="subyes">${T.yes}</button><button class="btn sec" data-act="subno">${T.no}</button></div>`;
  if(g.length>1)h+=`<div class="lbl">${T.mlMaybe}</div><div class="chips">`+g.slice(1).map(x=>chip(false,'picksub',x.id,T.subs[x.id])).join('')+`</div>`;
  if(skip||back)h+=`<div class="row">${back}${skip}</div>`;
 }else if(d.phase==='dupchk'){h+=`<div class="lbl">${T.processing}</div>`;
 }else if(d.phase==='dup'&&d.dup){
  const o=d.dup.it;
  h+=`<div class="lbl">${d.dup.strong?T.dupStrong:T.dupWeak}</div><div class="row" style="align-items:flex-start"><div style="flex:1;text-align:center"><div class="small">${T.dupOld}</div>${o.img?`<img class="prev" src="${o.img}" alt="">`:`<div style="font-size:48px">${EMOJI[o.cat]}</div>`}</div><div style="flex:1;text-align:center"><div class="small">${T.dupNew}</div>${d.img?`<img class="prev" src="${d.img}" alt="">`:`<div style="font-size:48px">${EMOJI[d.cat]}</div>`}</div></div>
  <div class="row"><button class="btn sec" data-act="dupadd">${T.dupAdd}</button><button class="btn" data-act="dupskip">${T.dupSkip}</button></div>`;
 }else if(d.phase==='confirmcat'){
  const g=d.guess;
  if(g==='loading'){
   h+=`<div class="lbl">${T.mlWait}</div>`+(ML.p&&!ML.ready?`<div class="small">${T.mlDownloading(ML.pct)}</div>`:'')}
  else if(Array.isArray(g)){
   h+=`<div class="lbl">${T.mlGuess}</div><div class="det"><span style="font-size:32px">${EMOJI[g[0].cat]}</span><b>${T.cats[g[0].cat]}</b></div>${d.lcat?`<div class="small">${T.learnedCat}</div>`:''}<div class="lbl">${T.correct}</div>
  <div class="row"><button class="btn" data-act="guessyes">${T.yes}</button><button class="btn sec" data-act="guessno">${T.no}</button></div>`;
   if(g.length>1)h+=`<div class="lbl">${T.mlMaybe}</div><div class="chips">`+g.slice(1).map(x=>chip(false,'pickguess',x.cat,`${EMOJI[x.cat]} ${T.cats[x.cat]}`)).join('')+`</div>`}
  if(skip||back)h+=`<div class="row">${back}${skip}</div>`;
 }else{
  if(d.mlErr)h+=`<div class="small" style="margin-bottom:6px">${T.mlFail}</div>`;
  else if(!S.ml&&!d.id)h+=`<div class="small" style="margin-bottom:6px">${T.mlHint}</div>`;
  else if(d.mlNone&&!d.cat)h+=`<div class="small" style="margin-bottom:6px">${T.mlNone}</div>`;
  const wide=S.pal||(d.color&&own(PX,d.color));
  h+=`<div class="lbl">${T.pickColor}${d.color?': <b>'+cname(d.color)+'</b>':''}</div><div class="palette${wide?' wide':''}">`+
   (wide?PAL_ALL:BASE).map(k=>`<button class="sw ${d.color===k?'on':''}" style="background:${P[k][0]}" data-act="color" data-v="${k}" aria-label="${esc(cname(k))}" title="${esc(cname(k))}"></button>`).join('')+`</div>`+
   `<div class="chips" style="padding:0 0 4px">${chip(S.pal,'togglepal','',S.pal?T.palBasic:T.palMore)}</div>`;
  h+=`<div class="lbl">${T.pickCat}</div>`+Object.keys(PICK).map(g=>{
   let ks=PICK[g].filter(k=>!(S.gender==='male'&&MALE_HIDE.includes(k)&&d.cat!==k));
   if(g==='acc'&&d.cat==='jewelry')ks=[...ks,'jewelry'];
   return `<div class="lbl" style="margin:4px 0 6px"><b>${T[g]}</b></div><div class="chips">`+
    ks.map(k=>chip(d.cat===k,'cat',k,`${EMOJI[k]} ${T.cats[k]}`)).join('')+`</div>`}).join('');
  if(d.cat==='shoes')h+=`<div class="lbl">${T.subQ}</div><div class="chips">`+SUBS.map(k=>chip(d.sub===k,'sub',k,T.subs[k])).join('')+`</div>`;
  const occ=occOf(d);
  h+=`<div class="lbl">${T.patQ}</div><div class="chips">`+PATS.map(k=>chip(patOf(d)===k,'pat',k,T.pats[k])).join('')+`</div>`;
  h+=`<div class="lbl">${T.occQ}</div><div class="chips">`+OCC.map(o=>chip(occ.includes(o),'occ',o,T.occs[o])).join('')+`</div>`;
  h+=`<div class="lbl">${T.seasonQ}</div><div class="chips">`+SEASONS.map(s=>chip((d.season||'all')===s,'season',s,T.seasons[s])).join('')+`</div>`;
  const more=!d.id&&qTotal<=1?`<button class="btn sec" data-act="savemore" ${d.color&&d.cat?'':'disabled'}>${T.saveMore}</button>`:'';
  h+=`<div class="row"><button class="btn" data-act="save" ${d.color&&d.cat?'':'disabled'}>${T.save}</button>${more}</div>
  <div class="row">${back}${skip}<button class="btn sec" data-act="close">${T.cancel}</button></div>`;
  if(d.id)h+=`<div class="row"><button class="btn danger" data-act="del">${T.del}</button></div>`;
 }
 return h}
function sheet(){
 const el=$('#sheet');
 if(!draft&&!panel){el.innerHTML='';return}
 const old=el.querySelector('.sheet'),st=old?old.scrollTop:0;
 el.innerHTML=`<div class="sheet-bg"><div class="sheet">${panel?panelHtml():draftHtml()}</div></div>`;
 const n=el.querySelector('.sheet');if(n)n.scrollTop=st;
}

/* ---------- events ---------- */
async function doSave(a){
  const isNew=!draft.id;
  if(isNew){try{
   if(draft.lab&&draft.color&&(draft.color!==draft.auto||draft.color!==draft.det))learnColor(draft.lab,draft.color);
   if(draft.emb&&draft.cat)learnCat(draft.emb,draft.cat,draft.sub);
   if(Array.isArray(draft.guess)&&draft.cat&&!draft.counted){LEARN.st.n++;if(draft.guess[0].cat===draft.cat)LEARN.st.ok++;draft.counted=true;saveLearn()}
  }catch(_){}}
  const it={id:draft.id||Date.now()+'-'+Math.random().toString(36).slice(2,7),img:draft.img,color:draft.color,cat:draft.cat,
   season:draft.season||'all',occ:Array.isArray(draft.occ)&&draft.occ.length?draft.occ:occOf(draft),t:draft.t||Date.now()};
  if(busy(draft))it.pat=patOf(draft);
  if(it.cat==='shoes'&&SUBS.includes(draft.sub))it.sub=draft.sub;
  await dbPut(it);await reload();S.outfits=null;
  if(a==='savemore'&&isNew)draft={id:null,img:null,color:null,cat:null,season:'all',phase:'photo',det:null};
  else if(isNew&&queue.length)advance();
  else{draft=null;queue=[];qTotal=0;qIndex=0}
  render();
}
async function doSearch(){
 const q=(S.q||'').trim();if(q.length<2)return;
 S.geoBusy=true;S.geoMsg='';render();
 try{S.geo=await geoSearch(q);S.geoMsg=S.geo.length?'':T.noCity}catch(_){S.geo=[];S.geoMsg=T.wxFail}
 S.geoBusy=false;render()}
document.addEventListener('click',async e=>{
 if(e.target.classList&&e.target.classList.contains('sheet-bg')){draft=null;panel=null;queue=[];qTotal=0;qIndex=0;sheet();return}
 const b=e.target.closest('[data-act]');if(!b)return;
 const a=b.dataset.act,v=b.dataset.v;
 if(a==='menu'){S.menu=!S.menu;const d=$('.dw');if(d)d.classList.toggle('open',S.menu)}
 else if(a==='profile'||a==='settings'){S.menu=false;panel=a;render()}
 else if(a==='export'){S.menu=false;exportData();render()}
 else if(a==='setlang'){LANG=v;ls.set('lang',v);render()}
 else if(a==='settheme'){THEME=v;ls.set('theme',v);render()}
 else if(a==='setgender'){S.gender=v;ls.set('gender',v);render()}
 else if(a==='tab'){S.tab=v;render();
  if(v==='suggest'&&S.loc&&(!S.wxAll||Date.now()-S.wxT>36e5)){await loadWx();render()}}
 else if(a==='filter'){S.filter=v;S.subF='';render()}
 else if(a==='setocc'){S.occ=v;render()}
 else if(a==='setmood'){S.mood=v;render()}
 else if(a==='openmust'){panel='pickitem';render()}
 else if(a==='clearmust'){S.must=null;S.outfits=null;render()}
 else if(a==='pickmust'){S.must=v;panel=null;S.outfits=null;render()}
 else if(a==='day'){S.day=+v;render()}
 else if(a==='search'){doSearch()}
 else if(a==='mylocate'){useMyLoc()}
 else if(a==='pickloc'){
  const g=S.geo[+v];if(!g)return;
  S.loc={name:g.name+(g.country?', '+g.country:''),lat:g.latitude,lon:g.longitude};
  ls.set('loc',JSON.stringify(S.loc));S.editLoc=false;S.geo=[];S.geoMsg='';S.q='';S.wxAll=null;S.wxErr='';S.outfits=null;
  render();await loadWx();render()}
 else if(a==='chloc'){S.editLoc=true;S.geo=[];S.geoMsg='';S.q='';render()}
 else if(a==='chcancel'){S.editLoc=false;S.geo=[];S.geoMsg='';render()}
 else if(a==='noloc'){S.loc=null;S.wxAll=null;S.wxErr='';S.editLoc=false;ls.del('loc');S.outfits=null;render()}
 else if(a==='retry'){S.wxErr='';render();await loadWx();render()}
 else if(a==='fab'){queue=[];qTotal=0;qIndex=0;draft={id:null,img:null,color:null,cat:null,season:'all',phase:'photo',det:null};sheet()}
 else if(a==='item'){const i=S.items.find(x=>x.id===v);if(i){draft={...i,season:i.season||'all',phase:'form'};sheet()}}
 else if(a==='nophoto'){go('form');sheet()}
 else if(a==='yes'){draft.color=draft.det;afterColor();sheet()}
 else if(a==='no'){afterColor();sheet()}
 else if(a==='guessyes'){if(Array.isArray(draft.guess))draft.cat=draft.guess[0].cat;go(draft.cat==='shoes'&&draft.subGuess?'confirmsub':'form');sheet()}
 else if(a==='guessno'){go('form');sheet()}
 else if(a==='pickguess'){draft.cat=v;go(v==='shoes'&&draft.subGuess?'confirmsub':'form');sheet()}
 else if(a==='subyes'){draft.sub=draft.subGuess[0].id;go('form');sheet()}
 else if(a==='subno'){go('form');sheet()}
 else if(a==='picksub'){draft.sub=v;go('form');sheet()}
 else if(a==='sub'){draft.sub=draft.sub===v?null:v;sheet()}
 else if(a==='subfilter'){S.subF=v;render()}
 else if(a==='back'){const d=draft;if(d&&d.hist&&d.hist.length){const prev=d.hist.pop();if(prev==='confirm')d.color=null;if(prev==='confirm'||prev==='confirmcat')d.cat=null;if(prev!=='form')d.sub=null;d.phase=prev;sheet()}}
 else if(a==='skip'){advance()}
 else if(a==='togglepal'){S.pal=!S.pal;ls.set('pal',S.pal?'1':'0');if(draft||panel)sheet();else render()}
 else if(a==='toggleml'){
  if(S.ml){S.ml=false;ls.set('ml','0');render()}
  else{
   if(!confirm(T.mlConfirm))return;
   S.ml=true;ls.set('ml','1');render();
   mlLoad().then(()=>render(),()=>{alert(T.mlFail);render()})}}
 else if(a==='resetlearn'){if(confirm(T.learnResetQ)){LEARN=cleanLearn(null);ls.del('learn');render()}}
 else if(a==='color'){draft.color=v;sheet()}
 else if(a==='cat'){draft.cat=v;if(v!=='shoes')draft.sub=null;sheet()}
 else if(a==='season'){draft.season=v;sheet()}
 else if(a==='pat'){draft.pat=v;sheet()}
 else if(a==='occ'){
  const cur=occOf(draft),n=cur.includes(v)?cur.filter(x=>x!==v):[...cur,v];
  if(n.length)draft.occ=OCC.filter(x=>n.includes(x));
  sheet()}
 else if(a==='close'){draft=null;panel=null;queue=[];qTotal=0;qIndex=0;sheet()}
 else if(a==='dupadd'){draft.dupOk=true;if(draft.dupEarly){draft.dupEarly=false;draft.dup=null;draft.phase='confirm';startGuess();sheet()}else{draft.phase='form';await doSave(draft.dupAct)}}
 else if(a==='dupskip'){if(queue.length)advance();else{draft=null;queue=[];qTotal=0;qIndex=0;sheet()}}
 else if(a==='save'||a==='savemore'){
  if(!draft.color||!draft.cat)return;
  if(!draft.id&&!draft.dupOk){
   const d=draft,dup=await findDup(d);
   if(draft!==d)return;
   if(dup){d.dup=dup;d.dupAct=a;d.phase='dup';sheet();return}}
  await doSave(a)}
 else if(a==='del'){if(confirm(T.confirmDel)){await dbDel(draft.id);await reload();draft=null;S.outfits=null;render()}}
 else if(a==='go'){
  const must=S.must&&S.items.find(i=>i.id===S.must)||null;
  const r=plan(S.items,S.occ,curWx(),S.outer,S.mood,must);
  S.outfits=r.outfits;S.msg=r.msgs.map(k=>T[k]).join(' ');
  render();
 }
});
document.addEventListener('input',e=>{if(e.target&&e.target.id==='q')S.q=e.target.value});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target&&e.target.id==='q'){e.preventDefault();doSearch()}});
document.addEventListener('change',async e=>{
 const t=e.target;
 if(t.matches&&t.matches('[data-in]')&&t.files&&t.files[0]){
  if(!draft)return;
  const files=[...t.files];t.value='';
  const d0=draft;d0.busy=true;sheet();
  const prepared=[];
  for(const f of files){try{prepared.push(await prepFile(f))}catch(_){}}
  if(draft!==d0)return; // the sheet was closed meanwhile
  if(!prepared.length){alert(T.imgErr);d0.busy=false;sheet();return}
  queue=prepared;qTotal=prepared.length;qIndex=0;
  showPrepared(queue.shift());sheet();
 }else if(t.matches&&t.matches('[data-imp]')&&t.files&&t.files[0]){
  const f=t.files[0];t.value='';S.menu=false;await importData(f);render();
 }else if(t.matches&&t.matches('[data-outer]')){S.outer=t.checked}
});

openDB().then(async()=>{
 try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(_){}
 await reload();render();
 if(S.loc){await loadWx();render()}
});
</script>
