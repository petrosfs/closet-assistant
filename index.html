<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#7b4b94">
<title>Closet Assistant</title>
<style>
:root{--bg:#faf7fb;--card:#fff;--ink:#241b2b;--mut:#7a6d84;--acc:#7b4b94;--line:#e8e0ed;--r:16px;color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#171219;--card:#241d28;--ink:#f3edf6;--mut:#a99bb3;--acc:#c79be0;--line:#3a3042;color-scheme:dark}}
:root[data-theme=dark]{--bg:#171219;--card:#241d28;--ink:#f3edf6;--mut:#a99bb3;--acc:#c79be0;--line:#3a3042;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);padding-bottom:calc(76px + env(safe-area-inset-bottom))}
header{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;position:sticky;top:0;background:var(--bg);z-index:5}
h1{font-size:20px;margin:0}
h2{font-size:18px;margin:0 0 12px}
button{font:inherit;color:inherit;cursor:pointer}
.menu-btn{border:0;background:none;font-size:26px;line-height:1;width:44px;height:44px;border-radius:12px;color:var(--ink)}
.sp{width:44px}
.btn{background:var(--acc);color:#fff;border:0;border-radius:999px;padding:12px 20px;font-weight:600;display:inline-block;text-align:center}
.btn[disabled]{opacity:.4}
.btn.sec{background:transparent;color:var(--acc);border:1.5px solid var(--acc)}
.btn.danger{background:transparent;color:#d33;border:1.5px solid #d33}
.chips{display:flex;flex-wrap:wrap;gap:8px;padding:0 16px 12px}
.sheet .chips{padding:0 0 12px}
.chip{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:8px 14px}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
.chip small{opacity:.75;margin-left:5px;font-size:12px}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chips.scroll::-webkit-scrollbar{display:none}
.chips.scroll>*{flex:none;white-space:nowrap}
.sw.sm{width:36px}
.sech{display:flex;justify-content:space-between;align-items:center;width:100%;border:0;background:none;padding:14px 16px 8px;font-size:16px;color:var(--ink)}
.sech span{color:var(--mut);font-size:13px}
.fx{margin:0 16px 12px;padding:2px 12px 8px;background:var(--card);border:1px solid var(--line);border-radius:var(--r)}
.fx .chips{padding:0 0 6px}
.sel{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.selc{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--line);border-radius:999px;padding:4px 10px 4px 4px;background:var(--card);font-size:14px}
.selc i{width:24px;height:24px;border-radius:50%;box-shadow:0 0 0 1px var(--line);display:inline-block}
.selc small{color:var(--mut)}
.selc .lnk{text-decoration:none;font-size:14px;padding:0 0 0 2px}
.aud{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
.aud .tile{width:60px;flex:none;font-size:22px}
.aud .b{flex:1;min-width:0;font-size:14px}
.aud .row{margin-top:6px;gap:6px}
.aud .btn{padding:8px 12px;font-size:14px;border-radius:14px;flex:1 1 auto}
.aud .btn:not(.sec){flex-basis:100%}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(105px,1fr));gap:10px;padding:0 16px}
.tile{position:relative;aspect-ratio:3/4;border-radius:var(--r);overflow:hidden;background:var(--card);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:38px;width:100%}
.tile img{width:100%;height:100%;object-fit:cover;display:block}
.tile img.cut{object-fit:contain;padding:6px;box-sizing:border-box}
.dot{position:absolute;left:6px;bottom:6px;width:20px;height:20px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.3)}
button.tile{padding:0}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:6}
nav button{flex:1;border:0;background:none;padding:14px 0;color:var(--mut)}
nav button.on{color:var(--acc);font-weight:700}
.fab{position:fixed;right:18px;bottom:calc(80px + env(safe-area-inset-bottom));width:58px;height:58px;border-radius:50%;border:0;background:var(--acc);color:#fff;font-size:32px;line-height:1;box-shadow:0 4px 14px rgba(0,0,0,.3);z-index:6}
.empty,.note{color:var(--mut);padding:24px 16px;text-align:center}
.note{font-size:13px;padding:16px}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;z-index:20}
.sheet{background:var(--card);width:100%;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
.prev{width:100%;max-height:260px;object-fit:contain;border-radius:12px;background:var(--bg);margin-bottom:12px}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}
.row>*{flex:1}
.palette{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:6px}
.palette.wide{grid-template-columns:repeat(6,1fr);gap:8px}
.sw{aspect-ratio:1;border-radius:50%;border:3px solid transparent;box-shadow:0 0 0 1px var(--line);padding:0}
.sw.on{border-color:var(--acc);box-shadow:0 0 0 2px var(--card),0 0 0 4px var(--acc)}
.lbl{font-size:14px;color:var(--mut);margin:10px 0 8px}
.det{display:flex;align-items:center;gap:12px;font-size:18px;margin:8px 0 4px}
.det i{width:36px;height:36px;border-radius:50%;display:inline-block;box-shadow:0 0 0 1px var(--line)}
.pad{padding:0 16px 12px}
.opt{display:flex;gap:10px;align-items:center;padding:0 16px 14px}
.opt input{width:20px;height:20px}
.inp{font:inherit;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;min-width:0}
.small{color:var(--mut);font-size:13px}
.outfit{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px;margin:0 16px 14px}
.outfit small{color:var(--mut);display:block;margin-bottom:8px}
.pieces{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.piece{width:86px;flex:none;text-align:center;font-size:12px}
.piece .tile{font-size:28px;margin-bottom:4px}
.piece span{color:var(--mut);display:block}
.statrow{display:flex;align-items:center;gap:8px;margin:6px 0;font-size:14px}
.statrow b{width:110px;flex:none;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar{flex:1;height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.bar span{display:block;height:100%;background:var(--acc)}
.packrow{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:none;padding:6px 0;color:var(--ink);font:inherit}
.packrow .tile{width:48px;flex:none;font-size:20px}
.packrow.done{opacity:.5}.packrow.done .t{text-decoration:line-through}
.dayh{padding:16px 16px 6px;font-weight:700;display:flex;justify-content:space-between;align-items:center;gap:8px}
.dayrow{display:flex;gap:8px;overflow-x:auto;padding:0 16px 4px}
.dayrow .tile{width:76px;flex:none}
.lnk{border:0;background:none;color:var(--mut);font:inherit;font-size:12px;font-weight:400;text-decoration:underline;padding:4px}
.drawer-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:30;opacity:0;pointer-events:none;transition:opacity .2s}
.drawer{position:fixed;top:0;bottom:0;left:0;width:min(82vw,320px);background:var(--card);z-index:31;transform:translateX(-100%);transition:transform .2s;padding:calc(18px + env(safe-area-inset-top)) 0 16px;overflow:auto;box-shadow:2px 0 14px rgba(0,0,0,.25)}
.dw.open .drawer-bg{opacity:1;pointer-events:auto}
.dw.open .drawer{transform:none}
.dh{font-size:20px;font-weight:700;padding:0 18px 12px}
.mi{display:flex;width:100%;gap:12px;align-items:center;padding:14px 18px;border:0;background:none;text-align:left;font-size:16px;cursor:pointer}
.mh{padding:14px 18px 4px;color:var(--mut);font-size:13px}
</style>
</head>

<div id="sheet"></div>

 if(e.status==='progress'){if(Number.isFinite(e.loaded)&&Number.isFinite(e.total)&&e.total>0){f.l=e.loaded;f.t=e.total}else if(Number.isFinite(e.progress)){f.l=e.progress;f.t=100}}

 let mn=Infinity,mx=-Infinity;for(let i=0;i<md.length;i++){const v=md[i];if(v<mn)mn=v;if(v>mx)mx=v}

 for(let i=0;i<N;i++){const a=(md[i]-mn)/(mx-mn||1);mi.data[i*4+3]=a<.15?0:a>.85?255:Math.round((a-.15)/.7*255)}

function addAcc(main,items,o,must){

 const hasDress=main.some(i=>i.cat==='dress');
 const cats=ACC.filter(c=>o.cold||!COLD.includes(c)).filter(c=>c!=='tights'||(hasDress&&o.tightsOk))
  .filter(c=>c!=='sunglasses'||!o.noSun).filter(c=>c!==mc)
  .sort(()=>Math.random()-.5)

 else if(mc==='bottom'){bots=[must];dr=[]}
 else if(mc==='dress'||mc==='jumpsuit'){dr=[must];tops=[];bots=[]}

 else if(mc==='shoes')sh=[must];
 let bases=[];dr.forEach(d=>bases.push([d]));tops.forEach(a=>bots.forEach(b=>bases.push([a,b])));

 // a big closet: look at a random sample instead of every possible combination
 const lim=(a,n)=>a.length>n?[...a].sort(()=>Math.random()-.5).slice(0,n):a;

function auditRefresh(id){

 A.list=A.list.filter(f=>f.id!==id);if(!it)return;
 const keep=photo.filter(f=>!(it.ok||[]).includes(f.code)&&!(f.code==='gsub'&&it.sub)&&!(f.fix&&f.fix.sub&&f.fix.sub===it.sub)&&!(f.code==='cat'&&f.fix.cat===it.cat)&&!(f.code==='col'&&colsOf(it).includes(f.fix.color)));
 A.list.push(...auditRules(it).filter(r=>!keep.some(k=>k.code===r.code)),...keep)}
const auditKey=f=>f.id+'|'+f.code+(f.other?'|'+f.other:'');
async function auditApply(f){
 const it=S.items.find(i=>i.id===f.id);if(!it||!f.fix)return false;
 const n={...it,...f.fix};
 if(f.fix.ssn)delete n.season;
 if(f.fix.cat&&!subOk(n.cat,n.sub))delete n.sub;
 if(f.fix.color&&Array.isArray(n.cols)){n.cols=n.cols.filter(c=>c!==n.color);if(!n.cols.length)delete n.cols}
 await dbPut(n);
 try{if(f.code==='col'&&f.lab)learnColor(f.lab,n.color);const e=f.emb||emOf(n);if(e&&(f.fix.cat||f.fix.sub))learnItem(e,n)}catch(_){}
 return true}
async function auditAct(a,key){

  const n=A.list.filter(f=>f.fix&&S.items.some(i=>i.id===f.id)).length;if(!n||!confirm(T.auditAllQ(n)))return;
  const seen=new Set();
  for(;;){const f=A.list.find(x=>x.fix&&!seen.has(auditKey(x))&&S.items.some(i=>i.id===x.id));if(!f)break;
   seen.add(auditKey(f));if(await auditApply(f))A.n++;drop(f);await reload();auditRefresh(f.id)}
  S.outfits=null;render();return}
 const f=find();if(!f)return;
 const it=S.items.find(i=>i.id===f.id);if(!it){drop(f);sheet();return}
 if(a==='aopen'){draft={...it,phase:'form'};sheet();return}
 let touched=false;
 if(a==='afix'){if(await auditApply(f))A.n++;drop(f);touched=true}
 else if(a==='askip')drop(f);
 else if(a==='adel'){if(!confirm(T.confirmDel))return;hcache.delete(it.id);await dbDel(it.id);A.list=A.list.filter(x=>x.id!==it.id&&x.other!==it.id);A.n++}
 else if(a==='akeep'){
  if(f.code==='dup'){if(f.h){if(Number.isInteger(f.ham))LEARN.dup.neg=[...LEARN.dup.neg,f.ham].slice(-50);LEARN.dup.pairs=[...LEARN.dup.pairs,pairKey(f.h,f.other)].slice(-200);saveLearn()}}
  else{
   await dbPut({...it,ok:AUDIT_CODES.filter(c=>c===f.code||(it.ok||[]).includes(c))});
   // "it is correct" also teaches: this look is this colour / this type
   try{if(f.code==='col'&&f.lab)learnColor(f.lab,it.color);else if((f.code==='cat'||f.code==='sub')&&f.emb)learnItem(f.emb,it)}catch(_){}}
  drop(f)}
 await reload();if(touched)auditRefresh(it.id);S.outfits=null;render()}

  if(skip||back)h+=`<div class="row">${back}${skip}</div>`;
 }else if(d.phase==='dupchk'){h+=`<div class="lbl">${T.processing}</div>`;

  if(!d.id&&d.autoF&&Object.keys(d.autoF).length)h+=`<div class="small" style="margin-bottom:6px">${T.autoNote}</div>`;
  const st=k=>!d.id&&d.autoF&&d.autoF[k]?' ✨':'';

  else h+=Object.keys(PICK).map(g=>{
   let ks=PICK[g].filter(k=>!(S.gender==='male'&&MALE_HIDE.includes(k)&&d.cat!==k));

   return `<div class="lbl" style="margin:4px 0 6px"><b>${T[g]}</b></div><div class="chips">`+

  if(SUBT[d.cat])h+=`<div class="lbl">${T.subQs[d.cat]}</div><div class="chips">`+SUBT[d.cat].map(k=>chip(d.sub===k,'sub',k,T.subs[k])).join('')+`</div>`;
  // 2. pattern, then colours (a patterned piece can have several)
  h+=`<div class="lbl">${T.patQ}${st('pat')}</div><div class="chips">`+PATS.map(k=>chip(patOf(d)===k,'pat',k,T.pats[k])).join('')+`</div>`;
  const cl=d.color?colsOf(d).filter(c=>own(P,c)):[],wide=S.pal||cl.some(c=>own(PX,c));
  h+=`<div class="lbl">${T.pickColor}</div>`;
  if(cl.length)h+=`<div class="sel">`+cl.map((c,j)=>`<span class="selc"><i style="background:${P[c][0]}"></i>${esc(cname(c))}${j===0&&cl.length>1?` <small>(${T.mainCol})</small>`:''}${cl.length>1?`<button class="lnk" data-act="color" data-v="${c}" aria-label="✕">✕</button>`:''}</span>`).join('')+`</div>`;
  const sw=k=>`<button class="sw ${cl.includes(k)?'on':''}" style="background:${P[k][0]}" data-act="color" data-v="${k}" aria-label="${esc(cname(k))}" title="${esc(cname(k))}"></button>`;
  h+=`<div class="palette${wide?' wide':''}">`+(wide?PAL_ALL:BASE).map(sw).join('')+`</div>`+
   `<div class="small" style="margin:2px 0 8px">${busy(d)?T.multiOn:T.multiHint}</div>`+
   `<div class="chips" style="padding:0 0 4px">${chip(S.pal,'togglepal','',S.pal?T.palBasic:T.palMore)}</div>`+
   `<div class="small" style="margin:2px 0 4px">${T.patCols}</div><div class="palette wide">`+PAT_COLS.map(sw).join('')+`</div>`;
  // 3. fabric, occasions, seasons
  h+=`<div class="lbl">${T.matQ}${st('mat')}</div><div class="chips">`+MATS.map(k=>chip(d.mat===k,'mat',k,T.mats[k])).join('')+`</div>`;
  const occ=occOf(d),sn=ssnOf(d);
  h+=`<div class="lbl">${T.occQ}${st('occ')}</div><div class="chips">`+OCC.map(o=>chip(occ.includes(o),'occ',o,T.occs[o])).join('')+`</div>`;
  h+=`<div class="lbl">${T.seasonQ}${st('ssn')}</div><div class="chips">`+chip(!sn.length||sn.length===4,'ssn','all',T.ssns.all)+SSN.map(k=>chip(sn.length<4&&sn.includes(k),'ssn',k,T.ssns[k])).join('')+`</div>`;
  // 4. optional details open on demand
  h+=`<div class="lbl">${T.optQ}</div>`;
  {const ob=d.openBrand||d.brand,op=d.openPrice||d.price;
   if(!ob||!op)h+=`<div class="chips">${ob?'':chip(false,'openbrand','',T.addBrand)}${op?'':chip(false,'openprice','',T.addPrice)}</div>`;
   if(ob)h+=`<div class="lbl">${T.brandQ}</div><input id="brand" class="inp" style="width:100%" maxlength="40" value="${esc(d.brand||'')}" autocomplete="off">`;
   if(op)h+=`<div class="lbl">${T.priceQ}</div><input id="price" class="inp" style="width:100%" inputmode="decimal" maxlength="9" value="${d.price?esc(String(d.price)):''}" autocomplete="off">`}
  if(d.id)h+=`<div class="row"><label class="btn sec">${d.img?T.changePhoto:T.addPhoto}<input type="file" accept="image/*" data-in2 hidden></label></div>`;
  const more=!d.id&&qTotal<=1?`<button class="btn sec" data-act="savemore" ${d.color&&d.cat?'':'disabled'}>${T.saveMore}</button>`:'';
  h+=`<div class="row"><button class="btn" data-act="save" ${d.color&&d.cat?'':'disabled'}>${T.save}</button>${more}</div>
  <div class="row">${back}${skip}<button class="btn sec" data-act="close">${T.cancel}</button></div>`;
  if(d.id){const n=(d.w||[]).length;
   h+=`<div class="small" style="margin-top:12px">${n?T.wornN(n,esc(fmtDate(lastWorn(d)))):T.wornNever}</div><div class="row"><button class="btn sec" data-act="wearitem">${T.wearToday}</button></div>`;
   h+=`<div class="row"><button class="btn danger" data-act="del">${T.del}</button></div>`}
 }
 return h}

async function doSave(a){
  const d=draft,isNew=!d.id;
  const it={id:d.id||Date.now()+'-'+Math.random().toString(36).slice(2,7),img:d.img,color:d.color,cat:d.cat,
   occ:Array.isArray(d.occ)&&d.occ.length?OCC.filter(x=>d.occ.includes(x)):occOf(d),t:d.t||Date.now()};
  if(busy(d)){it.pat=patOf(d);const c=[...new Set((d.cols||[]).filter(x=>own(P,x)&&x!==d.color))].slice(0,4);if(c.length)it.cols=c}
  {const n=ssnOf(d);if(n.length)it.ssn=SSN.filter(x=>n.includes(x))}
  if(MATS.includes(d.mat))it.mat=d.mat;
  if(d.cut&&it.img)it.cut=true;
  if(Number.isFinite(d.price)&&d.price>0&&d.price<=1e6)it.price=Math.round(d.price*100)/100;
  {const b=String(d.brand||'').replace(/[<>"&]/g,'').trim().slice(0,40);if(b)it.brand=b}
  if(Array.isArray(d.w)&&d.w.length)it.w=d.w;
  if(subOk(it.cat,d.sub))it.sub=d.sub;
  if(Array.isArray(d.ok)&&d.ok.length)it.ok=d.ok;
  if(it.img){if(d.emb)it.em=i8b64(q8(d.emb));else if(typeof d.em==='string'&&!d.newImg)it.em=d.em}
  // every save teaches: a new item, and also a correction of an existing one
  try{
   if(isNew&&d.lab&&d.color&&!own(PXP,d.color)&&(d.color!==d.auto||d.color!==d.det))learnColor(d.lab,d.color);
   if(it.em)learnItem(dq8(Array.from(b64i8(it.em))),it);
   if(isNew&&Array.isArray(d.guess)&&d.cat&&!d.counted){LEARN.st.n++;if(d.guess[0].cat===d.cat)LEARN.st.ok++;d.counted=true;saveLearn()}
  }catch(_){}
  hcache.delete(it.id);
  await dbPut(it);await reload();S.outfits=null;
  if(a==='savemore'&&isNew)draft=newDraft();
  else if(isNew&&queue.length)advance();
  else{draft=null;queue=[];qTotal=0;qIndex=0}
  if(panel==='audit'){draft=null;runAudit()}
  render();
}

  sheet()}
 else if(a==='uncut'){if(draft&&draft.orig){draft.img=draft.orig;draft.h=draft.hOrig;draft.cut=false;sheet()}}
 else if(a==='togglepal'){S.pal=!S.pal;ls.set('pal',S.pal?'1':'0');if(draft||panel)sheet();else render()}
 else if(a==='toggleml'){
  if(S.ml){S.ml=false;ls.set('ml','0');render()}
  else{
   if(!confirm(T.mlConfirm))return;
   S.ml=true;ls.set('ml','1');render();
   mlLoad().then(()=>render(),()=>{alert(T.mlFail);render()})}}
 else if(a==='resetlearn'){if(confirm(T.learnResetQ)){LEARN=cleanLearn(null);ls.del('learn');RATE=[];ls.del('rate');render()}}
 else if(a==='color'){
  if(!own(P,v))return;
  const d=draft,now=patOfColor(v),cur=d.color?colsOf(d).filter(c=>own(P,c)):[];
  if(!busy(d)){ // a plain piece has one colour; a pattern colour brings its pattern along
   d.color=v;d.cols=[];if(now){d.pat=now;(d.touched||(d.touched={})).pat=1}}
  else if(cur.includes(v)){if(cur.length>1){const n=cur.filter(x=>x!==v);d.color=n[0];d.cols=n.slice(1)}}
  else if(!cur.length){d.color=v;d.cols=[]}
  else if(cur.length<5)d.cols=[...cur.slice(1),v];
  sheet()}
 else if(a==='opencat'){draft.openCat=!draft.openCat;sheet()}
 else if(a==='cat'){draft.cat=v;draft.openCat=false;if(!subOk(v,draft.sub))draft.sub=null;autoFill(draft);sheet()}
 else if(a==='ssn'){
  const d=draft,cur=ssnOf(d);let n;
  if(v==='all')n=[...SSN];else if(SSN.includes(v)){const base=cur.length===4?[]:cur;n=base.includes(v)?base.filter(x=>x!==v):SSN.filter(x=>base.includes(x)||x===v)}else return;
  d.ssn=n;delete d.season;(d.touched||(d.touched={})).ssn=1;if(d.autoF)delete d.autoF.ssn;sheet()}
 else if(a==='pat'){if(PATS.includes(v)){const d=draft;d.pat=v;(d.touched||(d.touched={})).pat=1;if(d.autoF)delete d.autoF.pat;if(v==='solid')d.cols=[];sheet()}}
 else if(a==='mat'){if(MATS.includes(v)){const d=draft;d.mat=d.mat===v?undefined:v;(d.touched||(d.touched={})).mat=1;if(d.autoF)delete d.autoF.mat;autoFill(d);sheet()}}
 else if(a==='openbrand'||a==='openprice'){draft[a==='openbrand'?'openBrand':'openPrice']=true;sheet();const el=$(a==='openbrand'?'#brand':'#price');if(el)el.focus()}
 else if(a==='wearitem'){await wearOutfit([draft]);const it=S.items.find(x=>x.id===draft.id);if(it)draft.w=it.w;sheet()}
 else if(a==='wore'||a==='wofav'){
  const list=a==='wore'?(S.outfits&&S.outfits[+v]?[...S.outfits[+v].main,...S.outfits[+v].acc]:[]):((FAV[+v]||{ids:[]}).ids.map(id=>S.items.find(i=>i.id===id)).filter(Boolean));
  if(list.length){await wearOutfit(list);S.msg=T.woreOk;render()}}
 else if(a==='favsave'){
  const o=S.outfits&&S.outfits[+v];if(o){const list=[...o.main,...o.acc],k=favKey(list);
   if(isFav(list))FAV=FAV.filter(f=>[...f.ids].sort().join('+')!==k);else FAV=cleanFav([...FAV,{ids:list.map(i=>i.id)}]);
   saveFav();render()}}
 else if(a==='favdel'){FAV=FAV.filter((f,idx)=>idx!==+v);saveFav();render()}
 else if(a==='rate'){const o=S.outfits&&S.outfits[+v],r=+b.dataset.r;
  if(o&&(r===1||r===-1)){setRate([...o.main,...o.acc],r);render()}}
 else if(a==='planopen'){
  let list=[];
  if(v[0]==='o'){const o=S.outfits&&S.outfits[+v.slice(1)];if(o)list=[...o.main,...o.acc]}
  else if(v[0]==='f'){list=((FAV[+v.slice(1)]||{ids:[]}).ids).map(id=>S.items.find(i=>i.id===id)).filter(Boolean)}
  if(list.length>=2){const t=new Date();t.setDate(t.getDate()+1);S.planIds=list.map(i=>i.id);S.planD=dayStr(t);panel='plan';render()}}
 else if(a==='plansave'){const d=S.planD;
  if(S.planIds&&DATE_RE.test(d||'')&&d>=today()){PLAN=cleanPlan([...PLAN,{d,ids:S.planIds}]);savePlan();S.msg=T.planOk(fmtDate(d));panel=null;S.planIds=null;render()}}
 else if(a==='plandel'){if(DATE_RE.test(v)){PLAN=PLAN.filter(p=>p.d!==v);savePlan();render()}}
 else if(a==='woreplan'){const pp=PLAN.find(x=>x.d===v);
  if(pp&&v===today()){const list=pp.ids.map(id=>S.items.find(i=>i.id===id)).filter(Boolean);if(list.length)await wearOutfit(list);PLAN=PLAN.filter(x=>x.d!==v);savePlan();render()}}
 else if(a==='undoday'){if(DATE_RE.test(v)&&confirm(T.undoDayQ)){await undoDay(v);render()}}
 else if(a==='occ'){
  const cur=occOf(draft),n=cur.includes(v)?cur.filter(x=>x!==v):[...cur,v];
  if(n.length){draft.occ=OCC.filter(x=>n.includes(x));(draft.touched||(draft.touched={})).occ=1;if(draft.autoF)delete draft.autoF.occ}
  sheet()}
 else if(a==='close'){if(draft&&panel==='audit'){draft=null;sheet();return}draft=null;panel=null;S.audit=null;queue=[];qTotal=0;qIndex=0;sheet()}
 else if(a==='dupadd'||a==='dupno'){if(a==='dupno')learnDupNo(draft);draft.dupOk=true;if(draft.dupEarly){draft.dupEarly=false;draft.dup=null;draft.phase='confirm';startGuess();sheet()}else{draft.phase='form';await doSave(draft.dupAct)}}
 else if(a==='dupskip'){if(queue.length)advance();else{draft=null;queue=[];qTotal=0;qIndex=0;sheet()}}
 else if(a==='save'||a==='savemore'){
  if(!draft.color||!draft.cat)return;
  if(!draft.id&&!draft.dupOk){
   const d=draft,dup=await findDup(d);
   if(draft!==d)return;
   if(dup){d.dup=dup;d.dupAct=a;d.phase='dup';sheet();return}}
  await doSave(a)}
 else if(a==='del'){if(confirm(T.confirmDel)){hcache.delete(draft.id);await dbDel(draft.id);await reload();draft=null;S.outfits=null;if(panel==='audit')runAudit();render()}}
 else if(a==='go'){
  const must=S.must&&S.items.find(i=>i.id===S.must)||null;
  const r=plan(S.items,S.occ,curWx(),S.outer,S.mood,must,S.day);
  S.outfits=r.outfits;S.msg=r.msgs.map(k=>T[k]).join(' ');
  render();
 }
});
document.addEventListener('input',e=>{
 const t=e.target;if(!t)return;
 if(t.id==='q')S.q=t.value;
 else if(t.id==='price'&&draft){const v=parseFloat(String(t.value).replace(',','.'));draft.price=Number.isFinite(v)&&v>0&&v<=1e6?Math.round(v*100)/100:undefined}
 else if(t.id==='brand'&&draft)draft.brand=String(t.value).slice(0,40);
 else if(t.id==='cs'){S.cq=t.value;const g=$('#gridwrap');if(g)g.innerHTML=gridHtml()}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target&&e.target.id==='q'){e.preventDefault();doSearch()}});
document.addEventListener('change',async e=>{
 const t=e.target;
 if(t.matches&&t.matches('[data-in]')&&t.files&&t.files[0]){
  if(!draft)return;
  const files=[...t.files];t.value='';
  const d0=draft;d0.busy=true;sheet();
  const prepared=[];
  for(const f of files){try{prepared.push(await prepFile(f))}catch(_){}}
  if(draft!==d0)return; // the sheet was closed meanwhile
  if(!prepared.length){alert(T.imgErr);d0.busy=false;sheet();return}
  queue=prepared;qTotal=prepared.length;qIndex=0;
  showPrepared(queue.shift());sheet();
 }else if(t.matches&&t.matches('[data-in2]')&&t.files&&t.files[0]){
  const d=draft,f=t.files[0];t.value='';if(!d||!d.id)return;
  d.busy=true;sheet();
  try{const p=await prepFile(f);if(draft!==d)return;
   d.img=p.img;d.h=p.h;d.cut=false;d.orig=null;d.newImg=true;d.emb=null;
   if(S.ml)embedImg(d.img).then(e=>{d.emb=Array.from(e)},()=>{})}
  catch(_){alert(T.imgErr)}
  d.busy=false;if(draft===d)sheet();
 }else if(t.matches&&t.matches('[data-imp]')&&t.files&&t.files[0]){
  const f=t.files[0];t.value='';S.menu=false;await importData(f);render();
 }else if(t.matches&&t.matches('[data-pd]')){S.planD=t.value}
 else if(t.matches&&t.matches('[data-outer]')){S.outer=t.checked}
});

openDB().then(async()=>{
 try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(_){}
 await reload();render();
 if(S.loc){await loadWx();render()}
});
</script>
</body>
